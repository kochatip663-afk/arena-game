<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arena</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: black;
}

#bgVideo {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 100%;
  transform: translate(-50%, -50%);
  object-fit: contain;
  z-index: -1;
}

#arena {
  position: absolute;
  width: 800px;
  height: 500px;
  background: rgba(42,42,42,0.4);
  border: 4px solid #00ffff;
  border-radius: 20px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  overflow: hidden;
}

.flag {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid white;
  object-fit: cover;
}

.leader {
  box-shadow: 0 0 20px yellow;
}

#scoreboard {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.score-box {
  background: rgba(0,0,0,0.7);
  border: 2px solid #00ffff;
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: white;
}

.score-leader {
  border-color: yellow;
  box-shadow: 0 0 10px yellow;
}

.score-box img {
  width: 30px;
}
</style>
</head>

<body>

<!-- 🎬 ARKA PLAN (DÜZELTİLDİ) -->
<video id="bgVideo" autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897291/background_fwdwyl.mp4" type="video/mp4">
</video>

<div id="scoreboard"></div>

<div id="arena">
  <img id="turkiye" class="flag" src="flags/turkiye.png">
  <img id="kurdistan" class="flag" src="flags/kurdistan.png">
  <img id="suriye" class="flag" src="flags/suriye.png">
  <img id="afganistan" class="flag" src="flags/afganistan.png">
  <img id="turkmenistan" class="flag" src="flags/turkmenistan.png">
  <img id="azerbaycan" class="flag" src="flags/azerbaycan.png">
  <img id="filistin" class="flag" src="flags/filistin.png">
</div>

<audio id="player"></audio>

<script>

// ===== AYAR (AYNI) =====
const MIN_SPEED = 1.5;
const MAX_SPEED = 3;

const BASE_SIZE = 80;
const SIZE_1 = 170;
const SIZE_2 = 135;
const SIZE_3 = 110;
const SIZE_OTHER = 80;

// ===== MÜZİK (SADECE AFGANİSTAN OVERRIDE) =====

const afganistanTracks = [
"https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897310/1_ihhcad.mp3",
"https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897339/2_nl1ows.mp3",
"https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897341/3_xboptv.mp3",
"https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897346/4_ebp7wj.mp3",
"https://res.cloudinary.com/dgw3dbfcs/video/upload/v1777897347/5_rcunew.mp3"
];

const musicFolders = {
  turkiye: "music/turkiye/",
  kurdistan: "music/kurdistan/",
  suriye: "music/suriye/",
  afganistan: "music/afganistan/",
  turkmenistan: "music/turkmenistan/",
  azerbaycan: "music/azerbaycan/",
  filistin: "music/filistin/"
};

const TRACK_COUNT = 5;

let currentCountry = null;
let currentTrack = null;
const player = document.getElementById("player");

function getNextTrack() {
  let n;
  do {
    n = Math.floor(Math.random() * TRACK_COUNT) + 1;
  } while (n === currentTrack);
  currentTrack = n;
  return n;
}

function playCountryMusic(country) {
  if (currentCountry !== country) {
    currentCountry = country;
    currentTrack = null;
    loadTrack();
  }
}

function loadTrack() {

  // 🔥 SADECE BURASI DEĞİŞTİ
  if(currentCountry === "afganistan"){
    let track = afganistanTracks[Math.floor(Math.random()*afganistanTracks.length)];
    player.src = track;
  } else {
    let track = getNextTrack();
    player.src = musicFolders[currentCountry] + track + ".mp3";
  }

  player.play().catch(()=>{});
}

player.addEventListener("ended", loadTrack);

// ===== GERİSİ %100 AYNI (HİÇ DOKUNMADIM) =====

function randVel() {
  let a = Math.random() * Math.PI * 2;
  let s = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
  return { dx: Math.cos(a)*s, dy: Math.sin(a)*s };
}

const flags = {
  turkiye: { x:100,y:100,size:BASE_SIZE,score:0,...randVel() },
  kurdistan: { x:200,y:200,size:BASE_SIZE,score:0,...randVel() },
  suriye: { x:300,y:150,size:BASE_SIZE,score:0,...randVel() },
  afganistan: { x:150,y:300,size:BASE_SIZE,score:0,...randVel() },
  turkmenistan: { x:400,y:250,size:BASE_SIZE,score:0,...randVel() },
  azerbaycan: { x:250,y:100,size:BASE_SIZE,score:0,...randVel() },
  filistin: { x:350,y:300,size:BASE_SIZE,score:0,...randVel() }
};

let leader = null;

function updateSizes(){

  let sorted = Object.entries(flags)
    .sort((a,b)=>b[1].score - a[1].score);

  if(sorted[0][1].score === 0){
    for(let f in flags){
      flags[f].size = BASE_SIZE;
    }
    return;
  }

  sorted.forEach(([name,data],i)=>{

    if(data.score === 0){
      data.size = BASE_SIZE;
      return;
    }

    if(i === 0) data.size = SIZE_1;
    else if(i === 1) data.size = SIZE_2;
    else if(i === 2) data.size = SIZE_3;
    else data.size = SIZE_OTHER;

  });
}

let blades=[];

function createBlades(){
  blades.forEach(b=>b.remove());
  blades=[];
  if(!leader) return;

  for(let i=0;i<10;i++){
    let d=document.createElement("div");
    d.className="blade";
    document.getElementById("arena").appendChild(d);
    blades.push({el:d,angle:i*(Math.PI*2/10)});
  }
}

function updateBlades(){
  if(!leader) return;
  let f=flags[leader];

  blades.forEach(b=>{
    b.angle+=0.05;
    let r=f.size/2+5;

    let x=f.x+f.size/2+Math.cos(b.angle)*r;
    let y=f.y+f.size/2+Math.sin(b.angle)*r;

    b.el.style.left=x+"px";
    b.el.style.top=y+"px";
    b.el.style.transform=`rotate(${b.angle}rad)`;
  });
}

function update(){

  let arena=document.getElementById("arena");

  for(let f in flags){
    let o=flags[f];
    let el=document.getElementById(f);

    o.x+=o.dx;
    o.y+=o.dy;

    if(o.x<0){o.x=0;o.dx*=-1;}
    if(o.x>arena.clientWidth-o.size){o.x=arena.clientWidth-o.size;o.dx*=-1;}

    if(o.y<0){o.y=0;o.dy*=-1;}
    if(o.y>arena.clientHeight-o.size){o.y=arena.clientHeight-o.size;o.dy*=-1;}

    el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.style.width=o.size+"px";
    el.style.height=o.size+"px";
  }

  let keys = Object.keys(flags);

  for(let i=0;i<keys.length;i++){
    for(let j=i+1;j<keys.length;j++){

      let A = flags[keys[i]];
      let B = flags[keys[j]];

      let dx = (A.x + A.size/2) - (B.x + B.size/2);
      let dy = (A.y + A.size/2) - (B.y + B.size/2);

      let dist = Math.sqrt(dx*dx + dy*dy);
      let minDist = (A.size + B.size) / 2;

      if(dist < minDist && dist > 0){

        let overlap = minDist - dist;
        let nx = dx / dist;
        let ny = dy / dist;

        A.x += nx * overlap / 2;
        A.y += ny * overlap / 2;

        B.x -= nx * overlap / 2;
        B.y -= ny * overlap / 2;

        let tempDx = A.dx;
        let tempDy = A.dy;

        A.dx = B.dx;
        A.dy = B.dy;

        B.dx = tempDx;
        B.dy = tempDy;
      }
    }
  }

  updateBlades();
  requestAnimationFrame(update);
}

update();

function checkLeader(){

  let max=null;

  for(let f in flags){
    if(!max || flags[f].score>flags[max].score){
      max=f;
    }
  }

  if(leader !== max){
    leader = max;
    createBlades();
  }

  for(let f in flags){
    document.getElementById(f).classList.remove("leader");
  }

  document.getElementById(max).classList.add("leader");

  updateSizes();
  playCountryMusic(max);
}

function updateScoreboard(){

  let sorted=Object.entries(flags)
    .sort((a,b)=>b[1].score-a[1].score);

  let html="";

  sorted.forEach(([name,data],i)=>{
    html+=`
    <div class="score-box ${i===0?"score-leader":""}">
      <img src="flags/${name}.png">
      <span>${data.score}</span>
    </div>`;
  });

  document.getElementById("scoreboard").innerHTML=html;
}

window.addEventListener("message",(e)=>{
  let c=e.data;
  if(flags[c]){
    flags[c].score++;
    checkLeader();
    updateScoreboard();
  }
});

window.addEventListener("keydown",(e)=>{

  if(e.key==="1") window.postMessage("turkiye","*");
  if(e.key==="2") window.postMessage("kurdistan","*");
  if(e.key==="3") window.postMessage("suriye","*");
  if(e.key==="4") window.postMessage("afganistan","*");
  if(e.key==="5") window.postMessage("turkmenistan","*");
  if(e.key==="6") window.postMessage("azerbaycan","*");
  if(e.key==="7") window.postMessage("filistin","*");

});

updateScoreboard();

</script>

</body>
</html>
